services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: techstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_cluster:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cluster-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cluster-net

  backend1:
    build: ./server
    restart: unless-stopped
    environment: &backend_env
      PORT: 4000
      CORS_ORIGIN: http://localhost
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: techstore
      JWT_SECRET: cluster-access-secret
      JWT_EXPIRES_IN: 15m
      REFRESH_SECRET: cluster-refresh-secret
      REFRESH_EXPIRES_IN: 7d
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INSTANCE_ID: backend-1
      VAPID_PUBLIC_KEY: BKsyWkUvzBXDIVd-lnfHSacsazFLje_UPTwO3_vh9GhE0gsg9CFfGIvrii0wnbew_sPgCJbiiSwd4lEDo0dI-UE
      VAPID_PRIVATE_KEY: Pn48xZCoK_X2-5Clu-VMgvuX1C0PPu2s4BfL5cou9qM
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "4101:4000"
    networks:
      - cluster-net

  backend2:
    build: ./server
    restart: unless-stopped
    environment:
      <<: *backend_env
      INSTANCE_ID: backend-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "4102:4000"
    networks:
      - cluster-net

  backend3:
    build: ./server
    restart: unless-stopped
    environment:
      <<: *backend_env
      INSTANCE_ID: backend-backup
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "4103:4000"
    networks:
      - cluster-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/cluster/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    networks:
      - cluster-net

volumes:
  pgdata_cluster:

networks:
  cluster-net:
    driver: bridge
