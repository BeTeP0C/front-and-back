services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: techstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_lb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend1:
    build: ./server
    restart: unless-stopped
    environment: &backend_env
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: techstore
      JWT_SECRET: docker-access-secret
      JWT_EXPIRES_IN: 15m
      REFRESH_SECRET: docker-refresh-secret
      REFRESH_EXPIRES_IN: 7d
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VAPID_PUBLIC_KEY: BKsyWkUvzBXDIVd-lnfHSacsazFLje_UPTwO3_vh9GhE0gsg9CFfGIvrii0wnbew_sPgCJbiiSwd4lEDo0dI-UE
      VAPID_PRIVATE_KEY: Pn48xZCoK_X2-5Clu-VMgvuX1C0PPu2s4BfL5cou9qM
      INSTANCE_ID: backend-1
    ports:
      - "4001:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend2:
    build: ./server
    restart: unless-stopped
    environment:
      <<: *backend_env
      INSTANCE_ID: backend-2
    ports:
      - "4002:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend3:
    build: ./server
    restart: unless-stopped
    environment:
      <<: *backend_env
      INSTANCE_ID: backend-backup
    ports:
      - "4003:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx-lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/load-balancing/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy

  haproxy-lb:
    image: haproxy:2.9-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./deploy/load-balancing/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy

volumes:
  pgdata_lb:
